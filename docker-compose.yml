services:
  # IANSEO calls file_exists() in loops - a single page load makes ~220 file
  # syscalls, 64 of them on the same language file. That is free on a native
  # filesystem but costs ~1.7ms each through a Docker Desktop host bind mount,
  # turning a 10ms page into a 280ms one. So the app is served from a volume on
  # the container filesystem, refilled from ./ianseo on every start. ./ianseo
  # stays the source of truth: drop a new IANSEO release in and `up -d` picks it up.
  ianseo-sync:
    image: alpine:3
    volumes:
      - ianseo_app:/dst
      - ./ianseo:/src:ro
    command:
      - /bin/sh
      - -c
      - |
        if [ -z "$$(ls -A /src 2>/dev/null)" ]; then
          echo "./ianseo is empty - extract an IANSEO release into it first" >&2
          exit 1
        fi
        # Wipe first, so files dropped by a newer release do not linger.
        find /dst -mindepth 1 -delete
        cp -a /src/. /dst/
        # The app image runs as uid 1000, and IANSEO writes caches into its own tree.
        chown -R 1000:1000 /dst

  app:
    build: .
    ports:
      - 80:80
    volumes:
      - ianseo_app:/var/www/html/
      # Modules/Custom is IANSEO's own extension point, the one directory meant to
      # hold your code. Mounted straight from the host so edits are live, with no
      # resync: it is small enough that its slower file access does not show up.
      # Add further live directories in docker-compose.override.yml - see readme.
      - ./ianseo/Modules/Custom:/var/www/html/Modules/Custom
    depends_on:
      ianseo-sync:
        condition: service_completed_successfully

  db:
    image: mysql:8.4
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ianseo
      MYSQL_USER: ianseo
      MYSQL_PASSWORD: ianseo
      MYSQL_DATABASE: ianseo

  adminer:
    image: adminer:5
    ports:
      - 8080:8080

  backup:
    image: mysql:8.4
    depends_on:
      - db
    environment:
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-1800}
      BACKUP_KEEP: ${BACKUP_KEEP:-3}
      MYSQL_PWD: ianseo
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$BACKUP_INTERVAL" in
          ''|*[!0-9]*|0) echo "BACKUP_INTERVAL must be a positive integer" >&2; exit 1 ;;
        esac
        case "$$BACKUP_KEEP" in
          ''|*[!0-9]*|0) echo "BACKUP_KEEP must be a positive integer" >&2; exit 1 ;;
        esac
        # Dumps hold the whole database; keep them readable by their owner only.
        umask 077
        until mysqladmin ping -h db --silent 2>/dev/null; do sleep 2; done
        while true; do
          f=/backups/ianseo-$$(date +%Y-%m-%d_%H%M%S).sql.gz
          # Dump to a temp file first: a piped `mysqldump | gzip` hides mysqldump's
          # exit status, so a failed dump would be stored as a valid empty backup.
          if mysqldump -h db -u ianseo --single-transaction --no-tablespaces ianseo > /tmp/dump.sql &&
             gzip -c /tmp/dump.sql > "$$f.tmp" &&
             mv "$$f.tmp" "$$f"; then
            :
          else
            echo "backup failed" >&2
            rm -f "$$f.tmp"
          fi
          rm -f /tmp/dump.sql
          ls -1t /backups/ianseo-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep "$$BACKUP_INTERVAL"
        done
    restart: unless-stopped

volumes:
  db_data:
  ianseo_app:
