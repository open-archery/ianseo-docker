# IANSEO calls file_exists() in loops - a single page load makes ~220 file
# syscalls, 64 of them on the same language file. That is free on a native
# filesystem but costs ~1.7ms each through a Docker Desktop host bind mount,
# turning a 10ms page into a 280ms one. So the app is served from a volume on the
# container filesystem, and that volume - not ./ianseo - is what the running app
# reads and writes. IANSEO writes into its own tree: the installer's
# config.inc.php, HHT score files, tournament exports, and the files its built-in
# updater downloads. Copying ./ianseo over the volume on every start would revert
# all of that, so the copy happens only when asked. See readme.
x-ianseo-copy: &ianseo-copy
  image: alpine:3
  volumes:
    - ianseo_app:/dst
    - ./ianseo:/src:ro
  command:
    - /bin/sh
    - -c
    - |
      set -e
      if [ -z "$$(ls -A /src 2>/dev/null)" ]; then
        echo "./ianseo is empty - extract an IANSEO release into it first" >&2
        exit 1
      fi
      # The sentinel marks a finished copy. Testing it rather than "is /dst empty"
      # means an interrupted copy is retried instead of being mistaken for a
      # complete tree.
      if [ -z "$$FORCE" ] && [ -f /dst/.ianseo-seeded ]; then
        echo "volume already holds an IANSEO tree - leaving it alone"
        echo "(docker compose run --rm ianseo-push to copy ./ianseo in)"
        exit 0
      fi
      echo "copying ./ianseo into the volume..."
      # Over the top, never wiping first: anything IANSEO wrote itself exists only
      # here, so clearing the volume would destroy it.
      cp -a /src/. /dst/
      date -u +%Y-%m-%dT%H:%M:%SZ > /dst/.ianseo-seeded
      # The app image runs as uid 1000, and IANSEO writes into its own tree.
      chown -R 1000:1000 /dst
      echo "done"

services:
  # Seeds the volume on first start, then no-ops. `app` waits for it, so a failed
  # seed keeps the app from starting on an empty document root.
  ianseo-sync:
    <<: *ianseo-copy

  # Same copy, forced: run this after extracting a new IANSEO release into
  # ./ianseo. Not started by `up` - `docker compose run --rm ianseo-push`.
  ianseo-push:
    <<: *ianseo-copy
    profiles: [tools]
    environment:
      FORCE: "1"

  # The other direction: make ./ianseo match the volume, so that what IANSEO's
  # own updater did to the served tree ends up on the host. Deletions are
  # mirrored, which is the point - the updater removes files too - and which is
  # also why this one is careful about what it is allowed to touch.
  ianseo-export:
    profiles: [tools]
    image: alpine:3
    volumes:
      - ianseo_app:/dst
      - ./ianseo:/src
    environment:
      # Mounted into the app from the host, so the host owns them and the volume's
      # stale copies must never be written back over them. Keep this in step with
      # the bind mounts on the app service below.
      LIVE_DIRS: "Modules/Custom Modules/Sets/PL"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        # Without this guard an unseeded volume would mirror an empty tree onto
        # ./ianseo and --delete would empty the directory.
        if [ ! -f /dst/.ianseo-seeded ]; then
          echo "the volume holds no IANSEO tree - refusing to mirror it onto ./ianseo" >&2
          exit 1
        fi
        if [ -z "$$(ls -A /src 2>/dev/null)" ]; then
          echo "./ianseo is empty - refusing, check the mount" >&2
          exit 1
        fi
        apk add --no-cache rsync >/dev/null
        set --
        for d in $$LIVE_DIRS; do set -- "$$@" --exclude="/$$d/"; done
        # Volume bookkeeping, and a tracked file this repository ships.
        set -- "$$@" --exclude=/.ianseo-seeded --exclude=/.gitignore
        # --no-owner/--no-group: the volume is owned by uid 1000 and ./ianseo by
        # whoever checked it out, so syncing ownership would mark every single
        # file as changed and bury the deletions this preview exists to show.
        set -- "$$@" -a --delete --no-owner --no-group
        echo "--- what this would change in ./ianseo ---"
        rsync "$$@" --itemize-changes --dry-run /dst/ /src/
        echo "------------------------------------------"
        if [ -n "$$DRY_RUN" ]; then
          echo "DRY_RUN set - nothing written"
          exit 0
        fi
        rsync "$$@" /dst/ /src/
        # Give anything just written the ownership ./ianseo already has, rather
        # than leaving root-owned files in someone's home directory on Linux.
        chown -R "$$(stat -c '%u:%g' /src)" /src
        echo "./ianseo now mirrors the volume"

  app:
    build: .
    ports:
      - 80:80
    volumes:
      - ianseo_app:/var/www/html/
      # These two are mounted straight from the host, so edits are live with no
      # resync. Both are small enough that their slower file access does not show
      # up; the rest of the tree is what made the bind mount expensive.
      # Modules/Custom is IANSEO's own extension point, meant to hold your code.
      - ./ianseo/Modules/Custom:/var/www/html/Modules/Custom
      # Modules/Sets/PL is the Polish rule set (open-archery/ianseo-polish-rules),
      # developed in place against this setup.
      - ./ianseo/Modules/Sets/PL:/var/www/html/Modules/Sets/PL
    depends_on:
      ianseo-sync:
        condition: service_completed_successfully

  db:
    image: mysql:8.4
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ianseo
      MYSQL_USER: ianseo
      MYSQL_PASSWORD: ianseo
      MYSQL_DATABASE: ianseo

  adminer:
    image: adminer:5
    ports:
      - 8080:8080

  backup:
    image: mysql:8.4
    depends_on:
      - db
    environment:
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-1800}
      BACKUP_KEEP: ${BACKUP_KEEP:-3}
      MYSQL_PWD: ianseo
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$BACKUP_INTERVAL" in
          ''|*[!0-9]*|0) echo "BACKUP_INTERVAL must be a positive integer" >&2; exit 1 ;;
        esac
        case "$$BACKUP_KEEP" in
          ''|*[!0-9]*|0) echo "BACKUP_KEEP must be a positive integer" >&2; exit 1 ;;
        esac
        # Dumps hold the whole database; keep them readable by their owner only.
        umask 077
        until mysqladmin ping -h db --silent 2>/dev/null; do sleep 2; done
        while true; do
          f=/backups/ianseo-$$(date +%Y-%m-%d_%H%M%S).sql.gz
          # Dump to a temp file first: a piped `mysqldump | gzip` hides mysqldump's
          # exit status, so a failed dump would be stored as a valid empty backup.
          if mysqldump -h db -u ianseo --single-transaction --no-tablespaces ianseo > /tmp/dump.sql &&
             gzip -c /tmp/dump.sql > "$$f.tmp" &&
             mv "$$f.tmp" "$$f"; then
            :
          else
            echo "backup failed" >&2
            rm -f "$$f.tmp"
          fi
          rm -f /tmp/dump.sql
          ls -1t /backups/ianseo-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep "$$BACKUP_INTERVAL"
        done
    restart: unless-stopped

volumes:
  db_data:
  ianseo_app:
